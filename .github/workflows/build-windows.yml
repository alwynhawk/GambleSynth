# Builds the Windows standalone + VST3 on GitHub's runners, because the project
# is developed on Linux and there's no cross-compiler for a proper MSVC build.
# Push this repo to GitHub and the artifacts appear under each run.
name: Build (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a build by hand from the Actions tab

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Print what the runner actually has, so a future image change explains
      # itself instead of just failing with "could not find any instance".
      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -latest -products * -property displayName }
          else { Write-Host "vswhere not found" }

      # No -G/-A: let CMake pick whichever Visual Studio the image ships with.
      # Pinning the generator string broke the moment the runner image moved on.
      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run the test suite
        shell: bash
        run: |
          set -e
          EXE="build/RenderTest_artefacts/Release/RenderTest.exe"
          for mode in clicktest fxtest filtertest monotest synctest aliastest locktest devtest hosttest fruittest arptest wttest addtest libtest paramtest nudgetest varietytest; do
            echo "--- $mode ---"
            "$EXE" "$mode"
          done

      # Steinberg-ecosystem host-compatibility validation. Covers what the
      # in-house suite cannot: the VST3 wrapper itself, parameter thread safety,
      # editor open/close cycles, and every sample rate and block size a host
      # might pick. Strictness 10 is the maximum.
      - name: pluginval
        shell: pwsh
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = "build\GambleSynth_artefacts\Release\VST3\GambleSynth.vst3"
          & .\pluginval\pluginval.exe --strictness-level 10 --validate $vst3
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed" }

      - name: Collect the build
        shell: bash
        run: |
          mkdir -p dist/GambleSynth
          cp -r build/GambleSynth_artefacts/Release/VST3/GambleSynth.vst3 dist/GambleSynth/
          cp build/GambleSynth_artefacts/Release/Standalone/GambleSynth.exe dist/GambleSynth/
          cp README.md dist/GambleSynth/

      # The version comes from CMakeLists so there is one place to bump it.
      - name: Read the version
        id: version
        shell: bash
        run: |
          v=$(grep -oE 'project\(GambleSynth VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup ships with the runner image; install it if that changes.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} `
                  /O"$PWD\dist" installer\GambleSynth.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # The installer is what people download; the loose files are kept so a
      # tester can drop a .vst3 in by hand without running an installer.
      - uses: actions/upload-artifact@v4
        with:
          name: GambleSynth-windows-installer
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GambleSynth-windows-portable
          path: dist/GambleSynth/
